<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Projects – Rijin Choi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Inter + fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="min-h-screen bg-white flex items-center justify-center px-4 py-8">

  <!-- 고정 카드: 크기는 CSS에서 관리 (card-projects 클래스) -->
  <div class="card-projects bg-[#242424] text-white flex flex-col px-10 pt-10 pb-8">

    <!-- 상단: 타이틀 + 오른쪽 버튼 -->
    <div class="flex items-center justify-between mb-8 gap-4">
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight">
        PROJECTS
      </h1>

      <div class="flex items-center gap-3">
        <!-- 슬라이드 처음으로 -->
        <button
          id="firstSlideBtn"
          class="btn-pill btn-accent"
          type="button"
        >
          First Slide
        </button>

        <!-- 탑(포트폴리오) 페이지로 -->
        <a
          href="index.html"
          class="btn-pill btn-accent flex items-center justify-center"
        >
          Back to Portfolio
        </a>
      </div>
    </div>

    <!-- 슬라이드 뷰어 영역 -->
    <div class="flex-1 flex items-center justify-center">
      <!-- 검은 프레임 (카드와 독립된 슬라이드 컨테이너) -->
      <div class="slide-frame-wrapper bg-black">
        <iframe
          id="slideFrame"
          src="https://docs.google.com/presentation/d/e/2PACX-1vS23s4kDuy0U77YRiGIhNaxCnlwa9qQeWSJQGiTASzZQ-QyoKaD7aAXcC7C5rDo6b9d0qHUUkaa2_Fp/pubembed?start=true&loop=false&delayms=30000"
          style="border:0; width:100%; height:100%;"
          allowfullscreen="true"
          mozallowfullscreen="true"
          webkitallowfullscreen="true"
        ></iframe>
      </div>
    </div>
  </div>

  <script>
    // 슬라이드 첫 페이지로 돌아가기 (src 초기화)
    const firstSlideBtn = document.getElementById('firstSlideBtn');
    const slideFrame = document.getElementById('slideFrame');
    const SLIDE_URL =
      "https://docs.google.com/presentation/d/e/2PACX-1vS23s4kDuy0U77YRiGIhNaxCnlwa9qQeWSJQGiTASzZQ-QyoKaD7aAXcC7C5rDo6b9d0qHUUkaa2_Fp/pubembed?start=true&loop=false&delayms=30000";

    firstSlideBtn.addEventListener('click', () => {
      slideFrame.src = SLIDE_URL;
    });
  </script>

</body>
</html>
