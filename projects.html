<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Projects – Rijin Choi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Inter + fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="min-h-screen bg-white flex items-center justify-center px-4 py-8">

  <!-- 검은 Projects 카드 -->
  <div class="card-projects text-white bg-[#242424] relative">

    <!-- 상단 타이틀 -->
    <div class="flex items-center justify-center pt-8 px-12 relative">
      <h1 class="projects-title text-3xl md:text-4xl font-bold tracking-tight">
        Projects
      </h1>

      <!-- 오른쪽 상단 버튼들 -->
      <div class="projects-header-buttons flex items-center gap-3 absolute right-12 top-1/2 -translate-y-1/2">
        <!-- Restart 버튼 (슬라이드 처음으로) -->
        <button
          id="firstSlideBtn"
          type="button"
          class="btn-pill btn-accent text-sm md:text-base"
        >
          Restart
        </button>

        <!-- X 아이콘 (닫기 = index.html로 이동) -->
        <button
          type="button"
          onclick="location.href='index.html'"
          class="w-10 h-10 flex items-center justify-center bg-[#FFD27A] rounded-full hover:brightness-90 transition"
          aria-label="Close and go back to portfolio"
        >
          <img src="icon_close.svg" alt="" class="w-5 h-5" />
        </button>
      </div>
    </div>

    <!-- 슬라이드 영역: 카드 안에서 Y = 109px, 가로 960, 세로 611 -->
    <div class="slide-frame-wrapper bg-black">
     <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vS23s4kDuy0U77YRiGIhNaxCnlwa9qQeWSJQGiTASzZQ-QyoKaD7aAXcC7C5rDo6b9d0qHUUkaa2_Fp/pubembed?start=true&loop=false&delayms=30000" frameborder="0" width="900" height="569" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
    </div>

  </div>

  <script>
    // Restart 버튼 → 슬라이드 첫 페이지로
    const firstSlideBtn = document.getElementById('firstSlideBtn');
    const slideFrame = document.getElementById('slideFrame');

    const SLIDE_URL =
      "https://docs.google.com/presentation/d/e/2PACX-1vS23s4kDuy0U77YRiGIhNaxCnlwa9qQeWSJQGiTASzZQ-QyoKaD7aAXcC7C5rDo6b9d0qHUUkaa2_Fp/pubembed?start=true&loop=false&delayms=30000";

    firstSlideBtn.addEventListener('click', () => {
      slideFrame.src = SLIDE_URL;
    });
  </script>

</body>
</html>
