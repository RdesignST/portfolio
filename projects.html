<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">

  <title>Projects – Rijin Choi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="min-h-screen bg-white flex items-center justify-center px-4 py-8">

  <!-- Projects Card -->
  <div class="card-projects text-white bg-[#242424] relative">

    <!-- 🔶 상단 헤더 (0~109px 영역) -->
    <div class="projects-header">

      <!-- 가운데 타이틀 -->
      <h1 class="projects-title text-4xl font-bold text-center">
        Projects
      </h1>

      <!-- 오른쪽 버튼들 -->
      <div class="projects-header-buttons">

        <!-- Restart 버튼 -->
        <button id="firstSlideBtn" class="btn-accent">
          Restart
        </button>

        <!-- 닫기 버튼 -->
        <button
  type="button"
  onclick="location.href='index.html'"
  class="close-btn"
  aria-label="Close and go back to portfolio"
>
  <img src="icon_close.svg" alt="close" class="close-icon" />
</button>


      </div>
    </div>

    <!-- 🔶 슬라이드 프레임 (카드 상단에서 109px 아래) -->
    <div class="slide-frame-wrapper">
      <iframe
        id="slideFrame"
        src="https://docs.google.com/presentation/d/e/2PACX-1vS23s4kDuy0U77YRiGIhNaxCnlwa9qQeWSJQGiTASzZQ-QyoKaD7aAXcC7C5rDo6b9d0qHUUkaa2_Fp/pubembed?start=true&loop=false&delayms=30000"
        frameborder="0"
        allowfullscreen="true"
        mozallowfullscreen="true"
        webkitallowfullscreen="true"
        style="border:0; width:100%; height:100%;"
      ></iframe>
    </div>

  </div>

  <!-- Restart Script -->
  <script>
    const firstSlideBtn = document.getElementById('firstSlideBtn');
    const slideFrame = document.getElementById('slideFrame');

    const SLIDE_URL =
      "https://docs.google.com/presentation/d/e/2PACX-1vS23s4kDuy0U77YRiGIhNaxCnlwa9qQeWSJQGiTASzZQ-QyoKaD7aAXcC7C5rDo6b9d0qHUUkaa2_Fp/pubembed?start=true&loop=false&delayms=30000";

    firstSlideBtn.addEventListener("click", () => {
      slideFrame.src = SLIDE_URL;
    });
  </script>

</body>
</html>
