<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Rijin Choi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Inter + fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="min-h-screen bg-white flex items-center justify-center px-4 py-8">

  <!-- 고정 노란 카드 (높이 720 고정) -->
  <div class="card-main bg-[#FFD27A]">

    <!-- 상단 회색 바 (폭 416, 높이 12, 라운드 없음, 카드 상단에 고정) -->
    <div class="top-bar"></div>

    <!-- 내용 영역 -->
    <div class="content-main">

      <!-- 타이틀 -->
      <h1 class="title-main">
        PORTFOLIO
      </h1>

      <!-- 이름 + 역할 (같은 텍스트 박스, line-height: 150%) -->
      <p class="name-block">
        <span class="name-main">Rijin Choi</span><br />
        <span class="role-main">UI UX engineer, designer</span>
      </p>

      <!-- 정보 블록 (아이콘 + 텍스트 2줄) -->
      <div class="info-block">

        <!-- 줄 1: can communicate with -->
        <div class="info-row info-text">
          <img src="icon_Comment.svg" alt="" class="info-icon" />
          <span class="info-label">can communicate with:&nbsp;</span>
          <span class="info-value">Korean, Japanese, English</span>
        </div>

        <!-- 줄 2: Skills -->
        <div class="info-row info-text">
          <img src="icon_Autofix.svg" alt="" class="info-icon" />
          <span class="info-label">Skills:&nbsp;</span>
          <span class="info-value">Figma, Adobe, HTML, CSS, Javascript</span>
        </div>

      </div>

      <!-- 버튼 -->
      <div class="btn-wrapper">
        <a href="projects.html" class="btn-pill btn-primary">
          View Projects
        </a>
      </div>

    </div>
  </div>

</body>
</html>
